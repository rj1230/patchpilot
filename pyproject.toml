[project]
name = "patchpilot"
version = "0.1.0"
description = "Policy-controlled autonomous software-engineering agent: issue -> validated, review-ready PR"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "pyyaml>=6", "fastapi>=0.110", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "uvicorn>=0.29"]

[project.scripts]
patchpilot = "patchpilot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S102", "S307"]
ignore = ["E501", "B905", "UP042"]
